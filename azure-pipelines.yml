trigger:
- main

variables:
  # ---------- AGENT ----------
  AGENT_POOL: 'self-hosted'
  AGENT_NAME: 'ILYAS'

  # ---------- CACHES ----------
  COMPOSER_CACHE_DIR: '$(Pipeline.Workspace)\.composer'
  NPM_CACHE_DIR: '$(Pipeline.Workspace)\.npm'
  TRIVY_CACHE_DIR: '$(Pipeline.Workspace)\.trivy'

  # ---------- DOCKER ----------
  DOCKER_SC: 'DockerHubSC'
  DOCKER_REPO: 'ilyase25/akaunting'
  IMAGE_TAG: '$(Build.BuildId)'

  # ---------- DEPLOY ----------
  DEPLOY_PORT: '8080'
  DEPLOY_ENV_FILE: '$(Pipeline.Workspace)\deploy.env'

stages:
# =========================
# STAGE 1 : TEST
# =========================
- stage: test
  displayName: "Test (Laravel)"
  jobs:
  - job: phpunit
    displayName: "PHPUnit"
    pool:
      name: $(AGENT_POOL)
      demands:
      - Agent.Name -equals $(AGENT_NAME)
    steps:
    - checkout: self
      clean: true

    # ✅ FIX: create cache folders BEFORE Cache@2 (prevents tar chdir error)
    - powershell: |
        New-Item -ItemType Directory -Force -Path "$(COMPOSER_CACHE_DIR)" | Out-Null
        New-Item -ItemType Directory -Force -Path "$(NPM_CACHE_DIR)" | Out-Null
      displayName: "Create cache folders"

    - task: Cache@2
      inputs:
        key: 'composer | "$(Agent.OS)" | composer.lock'
        restoreKeys: |
          composer | "$(Agent.OS)"
        path: $(COMPOSER_CACHE_DIR)
      displayName: "Cache Composer"

    - task: Cache@2
      inputs:
        key: 'npm | "$(Agent.OS)" | package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
        path: $(NPM_CACHE_DIR)
      displayName: "Cache NPM"

    - powershell: |
        $ErrorActionPreference = "Stop"

        # use caches
        $env:COMPOSER_CACHE_DIR = "$(COMPOSER_CACHE_DIR)"
        npm config set cache "$(NPM_CACHE_DIR)" --global

        if (!(Test-Path ".env")) {
          if (Test-Path ".env.example") { Copy-Item ".env.example" ".env" }
          elseif (Test-Path ".env.testing") { Copy-Item ".env.testing" ".env" }
          else {
            Set-Content -Path ".env" -Value @(
              "APP_ENV=testing",
              "APP_KEY=",
              "APP_DEBUG=true",
              "DB_CONNECTION=sqlite",
              "DB_DATABASE=database/database.sqlite",
              "CACHE_DRIVER=array",
              "SESSION_DRIVER=array",
              "QUEUE_CONNECTION=sync"
            ) -Encoding utf8
          }
        }

        New-Item -ItemType Directory -Force -Path "database" | Out-Null
        if (!(Test-Path "database/database.sqlite")) {
          New-Item -ItemType File -Force "database/database.sqlite" | Out-Null
        }

        composer install --no-interaction --prefer-dist --no-progress
        php artisan key:generate --force
        php artisan test
      displayName: "Install + Test"

# =========================
# STAGE 2 : SECURITY (simple)
# =========================
- stage: security
  displayName: "Security (Gitleaks + Trivy)"
  dependsOn: test
  condition: succeeded()
  jobs:
  - job: security_scan
    displayName: "Secret scan + Image scan"
    pool:
      name: $(AGENT_POOL)
      demands:
      - Agent.Name -equals $(AGENT_NAME)
    steps:
    - checkout: self
      clean: true

    # ✅ create security cache folders
    - powershell: |
        New-Item -ItemType Directory -Force -Path "$(NPM_CACHE_DIR)" | Out-Null
        New-Item -ItemType Directory -Force -Path "$(TRIVY_CACHE_DIR)" | Out-Null
      displayName: "Create security cache folders"

    # (Optional) re-use npm cache (not required but fine)
    - task: Cache@2
      inputs:
        key: 'npm | "$(Agent.OS)" | package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
        path: $(NPM_CACHE_DIR)
      displayName: "Cache NPM (security)"

    # ✅ Trivy DB cache (speeds up scanning)
    - task: Cache@2
      inputs:
        key: 'trivy | "$(Agent.OS)"'
        restoreKeys: |
          trivy | "$(Agent.OS)"
        path: $(TRIVY_CACHE_DIR)
      displayName: "Cache Trivy DB"

    - powershell: |
        $ErrorActionPreference = "Stop"

        if (!(Get-Command gitleaks -ErrorAction SilentlyContinue)) {
          winget install -e --id Gitleaks.Gitleaks --accept-source-agreements --accept-package-agreements
        }

        gitleaks version
        gitleaks detect --source "$(Build.SourcesDirectory)" --no-git --redact
      displayName: "Gitleaks (secrets scan)"

    - powershell: |
        $ErrorActionPreference = "Stop"
        $img = "$(DOCKER_REPO):scan-$(Build.BuildId)"
        docker build -t $img "$(Build.SourcesDirectory)"
        docker images $img
      displayName: "Build image for security scan"

    - powershell: |
        $ErrorActionPreference = "Stop"

        if (!(Get-Command trivy -ErrorAction SilentlyContinue)) {
          winget install -e --id AquaSecurity.Trivy --accept-source-agreements --accept-package-agreements
        }

        $env:TRIVY_CACHE_DIR = "$(TRIVY_CACHE_DIR)"

        trivy --version
        $img = "$(DOCKER_REPO):scan-$(Build.BuildId)"

        # Fail on HIGH/CRITICAL
        trivy image --severity HIGH,CRITICAL --exit-code 1 $img
      displayName: "Trivy (image vuln scan)"

# =========================
# STAGE 3 : DOCKER BUILD + PUSH
# =========================
- stage: docker
  displayName: "Docker build & push"
  dependsOn: security
  condition: succeeded()
  jobs:
  - job: docker_build
    displayName: "Build and push image"
    pool:
      name: $(AGENT_POOL)
      demands:
      - Agent.Name -equals $(AGENT_NAME)
    steps:
    - checkout: self
      clean: true

    - task: Docker@2
      inputs:
        command: login
        containerRegistry: '$(DOCKER_SC)'
      displayName: "Docker login"

    - task: Docker@2
      inputs:
        containerRegistry: '$(DOCKER_SC)'
        repository: '$(DOCKER_REPO)'
        command: 'buildAndPush'
        Dockerfile: '$(Build.SourcesDirectory)\Dockerfile'
        buildContext: '$(Build.SourcesDirectory)'
        tags: |
          $(IMAGE_TAG)
          latest
      displayName: "Docker build & push"

# =========================
# STAGE 4 : DEPLOY (Docker Compose)
# =========================
- stage: deploy
  displayName: "Deploy (docker compose)"
  dependsOn: docker
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: deploy_local
    displayName: "Deploy on agent machine"
    pool:
      name: $(AGENT_POOL)
      demands:
      - Agent.Name -equals $(AGENT_NAME)
    steps:
    - checkout: self
      clean: true

    - task: Docker@2
      inputs:
        command: login
        containerRegistry: '$(DOCKER_SC)'
      displayName: "Docker login (deploy)"

    - powershell: |
        $ErrorActionPreference = "Stop"

        $lines = @(
          "DOCKER_REPO=$(DOCKER_REPO)",
          "IMAGE_TAG=$(IMAGE_TAG)",
          "APP_PORT=$(DEPLOY_PORT)"
        )
        Set-Content -Path "$(DEPLOY_ENV_FILE)" -Value $lines -Encoding utf8

        docker compose version
        docker compose --env-file "$(DEPLOY_ENV_FILE)" pull
        docker compose --env-file "$(DEPLOY_ENV_FILE)" up -d --remove-orphans
        docker ps
      displayName: "docker compose pull + up"

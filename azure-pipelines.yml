trigger:
- main

variables:
  # ---------- AGENT ----------
  AGENT_POOL: 'self-hosted'
  AGENT_NAME: 'ILYAS'

  # ---------- CACHES ----------
  COMPOSER_CACHE_DIR: '$(Pipeline.Workspace)\.composer'
  NPM_CACHE_DIR: '$(Pipeline.Workspace)\.npm'

  # ---------- DOCKER ----------
  DOCKER_SC: 'DockerHubSC'
  DOCKER_REPO: 'ilyase25/akaunting'
  IMAGE_TAG: '$(Build.BuildId)'

  # ---------- DEPLOY ----------
  DEPLOY_PORT: '8080'
  DEPLOY_ENV_FILE: '$(Pipeline.Workspace)\deploy.env'

stages:
# =========================
# STAGE 1 : TEST
# =========================
- stage: test
  displayName: "TEST"
  jobs:
  - job: phpunit
    displayName: "Laravel tests"
    pool:
      name: $(AGENT_POOL)
      demands:
      - Agent.Name -equals $(AGENT_NAME)

    steps:
    - checkout: self
      clean: true

    - powershell: |
        New-Item -ItemType Directory -Force -Path "$(COMPOSER_CACHE_DIR)" | Out-Null
        New-Item -ItemType Directory -Force -Path "$(NPM_CACHE_DIR)" | Out-Null
      displayName: "Create cache folders"

    - task: Cache@2
      inputs:
        key: 'composer | "$(Agent.OS)" | composer.lock'
        restoreKeys: |
          composer | "$(Agent.OS)"
        path: $(COMPOSER_CACHE_DIR)
      displayName: "Cache Composer"

    - task: Cache@2
      inputs:
        key: 'npm | "$(Agent.OS)" | package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
        path: $(NPM_CACHE_DIR)
      displayName: "Cache NPM"

    - powershell: |
        $ErrorActionPreference = "Stop"

        $env:COMPOSER_CACHE_DIR = "$(COMPOSER_CACHE_DIR)"
        npm config set cache "$(NPM_CACHE_DIR)" --global

        if (!(Test-Path ".env")) {
          if (Test-Path ".env.example") { Copy-Item ".env.example" ".env" }
          elseif (Test-Path ".env.testing") { Copy-Item ".env.testing" ".env" }
          else {
            Set-Content -Path ".env" -Value @(
              "APP_ENV=testing",
              "APP_KEY=",
              "APP_DEBUG=true",
              "DB_CONNECTION=sqlite",
              "DB_DATABASE=database/database.sqlite",
              "CACHE_DRIVER=array",
              "SESSION_DRIVER=array",
              "QUEUE_CONNECTION=sync"
            ) -Encoding utf8
          }
        }

        New-Item -ItemType Directory -Force -Path "database" | Out-Null
        if (!(Test-Path "database/database.sqlite")) {
          New-Item -ItemType File -Force "database/database.sqlite" | Out-Null
        }

        composer install --no-interaction --prefer-dist --no-progress
        php artisan key:generate --force
        php artisan test
      displayName: "Install + Test"

# =========================
# STAGE 2 : SECURITY
# =========================
- stage: security
  displayName: "SECURITY (Secrets, SAST, SCA)"
  dependsOn: test
  condition: succeeded()
  jobs:

  # ---- 1) GITLEAKS ----
  - job: gitleaks
    displayName: "Secrets Scan (Gitleaks)"
    pool:
      name: $(AGENT_POOL)
      demands:
      - Agent.Name -equals $(AGENT_NAME)

    steps:
    - checkout: self
      clean: true

    - powershell: |
        $ErrorActionPreference = "Stop"

        $release = Invoke-RestMethod -Headers @{ "User-Agent" = "azdo-agent" } `
          -Uri "https://api.github.com/repos/gitleaks/gitleaks/releases/latest"

        $asset = $release.assets | Where-Object { $_.name -match "windows_x64\.zip$" } | Select-Object -First 1
        if (-not $asset) { throw "Gitleaks not found" }

        $toolsDir = "$(Pipeline.Workspace)\tools\gitleaks"
        New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null

        $zipPath = Join-Path $toolsDir $asset.name
        Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
        Expand-Archive -Path $zipPath -DestinationPath $toolsDir -Force

        $gitleaksExe = Get-ChildItem -Path $toolsDir -Recurse -Filter "gitleaks.exe" | Select-Object -First 1
        & $gitleaksExe.FullName detect `
          --source "$(Build.SourcesDirectory)" `
          --no-git `
          --redact `
          --report-format json `
          --report-path "$(Build.ArtifactStagingDirectory)\gitleaks.json"
      displayName: "Run Gitleaks"

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)\gitleaks.json'
        artifactName: 'gitleaks-report'

  # ---- 2) SAST (Semgrep via Docker) ----
  - job: sast
    displayName: "SAST (Semgrep via Docker)"
    pool:
      name: $(AGENT_POOL)
      demands:
      - Agent.Name -equals $(AGENT_NAME)

    steps:
    - checkout: self
      clean: true

    - powershell: |
        $ErrorActionPreference = "Continue"
        Set-Location "$(Build.SourcesDirectory)"

        docker --version
        docker info | findstr -i "OSType"

        docker run --rm `
          -v "${PWD}:/src" `
          -w /src `
          returntocorp/semgrep `
          semgrep scan --config=auto --severity ERROR --json --output semgrep.json

        if (!(Test-Path "semgrep.json")) {
          '{"error":"semgrep.json was not generated (semgrep failed)."}' | Out-File -Encoding utf8 "semgrep.json"
        }

        Get-ChildItem "semgrep.json" | Format-List
      displayName: "Run Semgrep (Docker)"

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.SourcesDirectory)\semgrep.json'
        artifactName: 'sast-semgrep'
      condition: always()
      displayName: "Publish Semgrep report"

  # ---- 3) SCA (Composer + npm) ----
  - job: sca
    displayName: "SCA (Composer & npm)"
    pool:
      name: $(AGENT_POOL)
      demands:
      - Agent.Name -equals $(AGENT_NAME)

    steps:
    - checkout: self
      clean: true

    - powershell: |
        $ErrorActionPreference = "Continue"
        composer --version
        composer audit --format=json > composer-audit.json
        if (!(Test-Path "composer-audit.json")) { '{}' | Out-File -Encoding utf8 "composer-audit.json" }
      displayName: "Composer audit"

    - powershell: |
        $ErrorActionPreference = "Continue"
        node -v
        npm -v
        npm audit --json > npm-audit.json
        if (!(Test-Path "npm-audit.json")) { '{}' | Out-File -Encoding utf8 "npm-audit.json" }
      displayName: "npm audit"

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.SourcesDirectory)\composer-audit.json'
        artifactName: 'sca-composer'
      condition: always()
      displayName: "Publish Composer audit"

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.SourcesDirectory)\npm-audit.json'
        artifactName: 'sca-npm'
      condition: always()
      displayName: "Publish npm audit"

# =========================
# STAGE 3 : BUILD (dist + Docker build + push)
# =========================
- stage: build
  displayName: "BUILD (dist + Docker build & push)"
  dependsOn: security
  condition: succeeded()
  jobs:
  - job: docker_build
    displayName: "Build and push image"
    pool:
      name: $(AGENT_POOL)
      demands:
      - Agent.Name -equals $(AGENT_NAME)

    steps:
    - checkout: self
      clean: true

    - powershell: |
        New-Item -ItemType Directory -Force -Path "$(COMPOSER_CACHE_DIR)" | Out-Null
        New-Item -ItemType Directory -Force -Path "$(NPM_CACHE_DIR)" | Out-Null
      displayName: "Create cache folders (build)"

    - task: Cache@2
      inputs:
        key: 'composer | "$(Agent.OS)" | composer.lock'
        restoreKeys: |
          composer | "$(Agent.OS)"
        path: $(COMPOSER_CACHE_DIR)
      displayName: "Cache Composer (build)"

    - task: Cache@2
      inputs:
        key: 'npm | "$(Agent.OS)" | package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
        path: $(NPM_CACHE_DIR)
      displayName: "Cache NPM (build)"

    - powershell: |
        $ErrorActionPreference = "Stop"

        $env:COMPOSER_CACHE_DIR = "$(COMPOSER_CACHE_DIR)"
        npm config set cache "$(NPM_CACHE_DIR)" --global

        composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

        if (Test-Path "package-lock.json") { npm ci --no-audit --no-fund } else { npm install --no-audit --no-fund }
        $env:PATH = "$(Resolve-Path .)\node_modules\.bin;$env:PATH"
        .\node_modules\.bin\mix.cmd --production

        $dist = "$(Build.SourcesDirectory)\dist"
        if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
        New-Item -ItemType Directory -Force -Path $dist | Out-Null

        robocopy "$(Build.SourcesDirectory)" "$dist" /MIR `
          /XD ".git" ".github" "node_modules" "tests" "storage" "dist" `
          /XF ".env" | Out-Null

        $rc = $LASTEXITCODE
        if ($rc -ge 8) { throw "Robocopy failed with exit code $rc" }
        $global:LASTEXITCODE = 0

        New-Item -ItemType Directory -Force -Path "$dist\storage\framework" | Out-Null
        New-Item -ItemType Directory -Force -Path "$dist\storage\logs" | Out-Null

        if (!(Test-Path "$dist\vendor\autoload.php")) { throw "dist\vendor\autoload.php is missing!" }
      displayName: "Build dist (vendor + assets)"

    - task: Docker@2
      inputs:
        command: login
        containerRegistry: '$(DOCKER_SC)'
      displayName: "Docker login"

    - task: Docker@2
      inputs:
        containerRegistry: '$(DOCKER_SC)'
        repository: '$(DOCKER_REPO)'
        command: 'buildAndPush'
        Dockerfile: '$(Build.SourcesDirectory)\Dockerfile.dist'
        buildContext: '$(Build.SourcesDirectory)\dist'
        tags: |
          $(IMAGE_TAG)
          latest
      displayName: "Docker build & push (dist)"

# =========================
# STAGE 4 : DEPLOY (docker compose)
# =========================
- stage: deploy
  displayName: "DEPLOY (docker compose)"
  dependsOn: build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: deploy_local
    displayName: "Deploy on agent machine"
    pool:
      name: $(AGENT_POOL)
      demands:
      - Agent.Name -equals $(AGENT_NAME)

    steps:
    - checkout: self
      clean: true

    - task: Docker@2
      inputs:
        command: login
        containerRegistry: '$(DOCKER_SC)'
      displayName: "Docker login (deploy)"

    - powershell: |
        $ErrorActionPreference = "Stop"

        $lines = @(
          "DOCKER_REPO=$(DOCKER_REPO)",
          "IMAGE_TAG=$(IMAGE_TAG)",
          "APP_PORT=$(DEPLOY_PORT)",
          "APP_KEY=$(APP_KEY)",
          "DB_HOST=db",
          "DB_DATABASE=akaunting",
          "DB_USERNAME=akaunting",
          "DB_PASSWORD=ChangeMeStrongPassword"
        )
        Set-Content -Path "$(DEPLOY_ENV_FILE)" -Value $lines -Encoding utf8

        docker compose version
        docker compose --env-file "$(DEPLOY_ENV_FILE)" down
        docker compose --env-file "$(DEPLOY_ENV_FILE)" pull
        docker compose --env-file "$(DEPLOY_ENV_FILE)" up -d --remove-orphans --force-recreate
        docker ps

        docker exec -i akaunting_app sh -lc "ls -la /var/www/html/vendor/autoload.php"
      displayName: "docker compose (recreate) + verify"

trigger:
- main

variables:
  # ---------- AGENT ----------
  AGENT_POOL: 'self-hosted'
  AGENT_NAME: 'ILYAS'

  # ---------- CACHES ----------
  COMPOSER_CACHE_DIR: '$(Pipeline.Workspace)\.composer'
  NPM_CACHE_DIR: '$(Pipeline.Workspace)\.npm'

  # ---------- DOCKER ----------
  DOCKER_SC: 'DockerHubSC'
  DOCKER_REPO: 'ilyase25/akaunting'
  IMAGE_TAG: '$(Build.BuildId)'

  # ---------- DEPLOY ----------
  DEPLOY_PORT: '8080'
  DEPLOY_ENV_FILE: '$(Pipeline.Workspace)\deploy.env'

# =====================================================
# STAGE 1 : TEST
# =====================================================
stages:
- stage: test
  displayName: "TEST"
  jobs:
  - job: phpunit
    displayName: "Laravel tests"
    pool:
      name: $(AGENT_POOL)
      demands:
      - Agent.Name -equals $(AGENT_NAME)

    steps:
    - checkout: self
      clean: true

    - powershell: |
        New-Item -ItemType Directory -Force "$(COMPOSER_CACHE_DIR)" | Out-Null
        New-Item -ItemType Directory -Force "$(NPM_CACHE_DIR)" | Out-Null
      displayName: "Create cache folders"

    - task: Cache@2
      inputs:
        key: 'composer | "$(Agent.OS)" | composer.lock'
        path: $(COMPOSER_CACHE_DIR)
      displayName: "Cache Composer"

    - task: Cache@2
      inputs:
        key: 'npm | "$(Agent.OS)" | package-lock.json'
        path: $(NPM_CACHE_DIR)
      displayName: "Cache NPM"

    - powershell: |
        $ErrorActionPreference = "Stop"
        $env:COMPOSER_CACHE_DIR = "$(COMPOSER_CACHE_DIR)"
        npm config set cache "$(NPM_CACHE_DIR)" --global

        if (!(Test-Path ".env")) {
          Copy-Item ".env.example" ".env"
        }

        New-Item -ItemType Directory -Force database | Out-Null
        if (!(Test-Path "database/database.sqlite")) {
          New-Item -ItemType File "database/database.sqlite" | Out-Null
        }

        composer install --no-interaction --prefer-dist --no-progress
        php artisan key:generate --force
        php artisan test
      displayName: "Install + Test"

# =====================================================
# STAGE 2 : SECURITY (GITLEAKS)
# =====================================================
- stage: security
  displayName: "SECURITY"
  dependsOn: test
  condition: succeeded()

  jobs:
  - job: gitleaks
    displayName: "Secrets scan (Gitleaks)"
    pool:
      name: $(AGENT_POOL)

    steps:
    - checkout: self
      clean: true

    - powershell: |
        $ErrorActionPreference = "Stop"

        $release = Invoke-RestMethod -Headers @{ "User-Agent"="azdo" } `
          -Uri "https://api.github.com/repos/gitleaks/gitleaks/releases/latest"

        $asset = $release.assets | Where-Object { $_.name -match "windows_x64.zip" } | Select-Object -First 1
        if (-not $asset) { throw "Gitleaks not found" }

        $tools = "$(Pipeline.Workspace)\gitleaks"
        New-Item -ItemType Directory -Force $tools | Out-Null

        $zip = Join-Path $tools $asset.name
        Invoke-WebRequest $asset.browser_download_url -OutFile $zip
        Expand-Archive $zip $tools -Force

        $exe = Get-ChildItem $tools -Recurse -Filter gitleaks.exe | Select-Object -First 1
        & $exe.FullName detect `
          --source "$(Build.SourcesDirectory)" `
          --no-git `
          --redact `
          --report-format json `
          --report-path "$(Build.ArtifactStagingDirectory)\gitleaks.json"
      displayName: "Run Gitleaks"

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)\gitleaks.json'
        artifactName: 'gitleaks-report'

# =====================================================
# STAGE 3 : BUILD (OPTIMIZED & LIGHT)
# =====================================================
- stage: build
  displayName: "BUILD (optimized)"
  dependsOn: security
  condition: succeeded()

  jobs:
  - job: docker_build
    displayName: "Build & Push Docker image"
    timeoutInMinutes: 90
    pool:
      name: $(AGENT_POOL)
      demands:
      - Agent.Name -equals $(AGENT_NAME)

    steps:
    - checkout: self
      clean: true

    - powershell: |
        $ErrorActionPreference = "Stop"
        $env:COMPOSER_CACHE_DIR = "$(COMPOSER_CACHE_DIR)"

        composer install `
          --no-dev `
          --prefer-dist `
          --no-interaction `
          --no-progress `
          --optimize-autoloader

        composer clear-cache
      displayName: "Composer install (prod)"

    - powershell: |
        $ErrorActionPreference = "Stop"

        npm ci --no-audit --no-fund
        npx mix --production
        Remove-Item -Recurse -Force node_modules
      displayName: "Frontend build"

    - powershell: |
        $ErrorActionPreference = "Stop"

        $dist = "$(Build.SourcesDirectory)\dist"
        if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
        New-Item -ItemType Directory -Force $dist | Out-Null

        robocopy "$(Build.SourcesDirectory)" "$dist" /E `
          /XD ".git" ".github" ".idea" ".vscode" "tests" "node_modules" "dist" "storage" `
          /XF ".env" | Out-Null

        New-Item -ItemType Directory -Force "$dist\storage\framework" | Out-Null
        New-Item -ItemType Directory -Force "$dist\storage\logs" | Out-Null

        @(
          ".git",".github",".idea",".vscode",
          "tests","node_modules",".env","*.log"
        ) | Out-File -Encoding utf8 "$dist\.dockerignore"

        Write-Host "DIST SIZE (MB):"
        (Get-ChildItem $dist -Recurse | Measure-Object Length -Sum).Sum / 1MB
      displayName: "Prepare light dist"

    - task: Docker@2
      inputs:
        command: login
        containerRegistry: '$(DOCKER_SC)'
      displayName: "Docker login"

    - task: Docker@2
      inputs:
        command: buildAndPush
        containerRegistry: '$(DOCKER_SC)'
        repository: '$(DOCKER_REPO)'
        Dockerfile: '$(Build.SourcesDirectory)\Dockerfile.dist'
        buildContext: '$(Build.SourcesDirectory)\dist'
        tags: |
          $(IMAGE_TAG)
          latest
      displayName: "Docker build & push"

# =====================================================
# STAGE 4 : DEPLOY
# =====================================================
- stage: deploy
  displayName: "DEPLOY"
  dependsOn: build
  condition: succeeded()

  jobs:
  - job: deploy_local
    displayName: "Deploy with docker compose"
    pool:
      name: $(AGENT_POOL)

    steps:
    - checkout: self
      clean: true

    - task: Docker@2
      inputs:
        command: login
        containerRegistry: '$(DOCKER_SC)'
      displayName: "Docker login"

    - powershell: |
        $ErrorActionPreference = "Stop"

        @(
          "DOCKER_REPO=$(DOCKER_REPO)",
          "IMAGE_TAG=$(IMAGE_TAG)",
          "APP_PORT=$(DEPLOY_PORT)",
          "APP_KEY=$(APP_KEY)",
          "DB_HOST=db",
          "DB_DATABASE=akaunting",
          "DB_USERNAME=akaunting",
          "DB_PASSWORD=ChangeMeStrongPassword"
        ) | Out-File -Encoding utf8 "$(DEPLOY_ENV_FILE)"

        docker compose --env-file "$(DEPLOY_ENV_FILE)" pull
        docker compose --env-file "$(DEPLOY_ENV_FILE)" up -d --force-recreate
        docker ps
      displayName: "Deploy app"

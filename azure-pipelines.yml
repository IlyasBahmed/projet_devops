trigger:
- main

variables:
  # ---------- AGENT ----------
  AGENT_POOL: 'self-hosted'
  AGENT_NAME: 'ILYAS'

  # ---------- CACHES ----------
  COMPOSER_CACHE_DIR: '$(Pipeline.Workspace)\.composer'
  NPM_CACHE_DIR: '$(Pipeline.Workspace)\.npm'

  # ---------- DOCKER ----------
  DOCKER_SC: 'DockerHubSC'
  DOCKER_REPO: 'ilyase25/akaunting'
  IMAGE_TAG: '$(Build.BuildId)'

  # ---------- DEPLOY ----------
  DEPLOY_PORT: '8080'
  DEPLOY_ENV_FILE: '$(Pipeline.Workspace)\deploy.env'

stages:
# =========================
# STAGE 1 : TEST
#Installation des dépendances avec Composer

#Création du fichier .env pour les tests

#Utilisation de SQLite

#Exécution des tests Laravel avec PHPUnit
# =========================
- stage: test
  displayName: "TEST"
  jobs:
  - job: phpunit
    displayName: "Laravel tests"
    pool:
      name: $(AGENT_POOL)
      demands:
      - Agent.Name -equals $(AGENT_NAME)

    steps:
    - checkout: self
      clean: true

    - powershell: |
        New-Item -ItemType Directory -Force -Path "$(COMPOSER_CACHE_DIR)" | Out-Null
        New-Item -ItemType Directory -Force -Path "$(NPM_CACHE_DIR)" | Out-Null
      displayName: "Create cache folders"

    - task: Cache@2
      inputs:
        key: 'composer | "$(Agent.OS)" | composer.lock'
        restoreKeys: |
          composer | "$(Agent.OS)"
        path: $(COMPOSER_CACHE_DIR)
      displayName: "Cache Composer"

    - task: Cache@2
      inputs:
        key: 'npm | "$(Agent.OS)" | package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
        path: $(NPM_CACHE_DIR)
      displayName: "Cache NPM"

    - powershell: |
        $ErrorActionPreference = "Stop"

        $env:COMPOSER_CACHE_DIR = "$(COMPOSER_CACHE_DIR)"
        npm config set cache "$(NPM_CACHE_DIR)" --global

        if (!(Test-Path ".env")) {
          if (Test-Path ".env.example") { Copy-Item ".env.example" ".env" }
          elseif (Test-Path ".env.testing") { Copy-Item ".env.testing" ".env" }
          else {
            Set-Content -Path ".env" -Value @(
              "APP_ENV=testing",
              "APP_KEY=",
              "APP_DEBUG=true",
              "DB_CONNECTION=sqlite",
              "DB_DATABASE=database/database.sqlite",
              "CACHE_DRIVER=array",
              "SESSION_DRIVER=array",
              "QUEUE_CONNECTION=sync"
            ) -Encoding utf8
          }
        }

        New-Item -ItemType Directory -Force -Path "database" | Out-Null
        if (!(Test-Path "database/database.sqlite")) {
          New-Item -ItemType File -Force "database/database.sqlite" | Out-Null
        }

        composer install --no-interaction --prefer-dist --no-progress
        php artisan key:generate --force
        php artisan test
      displayName: "Install + Test"

# =========================
# STAGE 2 : SECURITY
#Utilisation de Gitleaks

#Scan des secrets dans le code

#Génération d’un rapport JSON

# =========================
- stage: security
  displayName: "SECURITY (Secrets, SAST, SCA)"
  dependsOn: test
  condition: succeeded()
  jobs:

  # ---- 1) GITLEAKS ----
  - job: gitleaks
    displayName: "Secrets Scan (Gitleaks)"
    pool:
      name: $(AGENT_POOL)
      demands:
      - Agent.Name -equals $(AGENT_NAME)

    steps:
    - checkout: self
      clean: true

    - powershell: |
        $ErrorActionPreference = "Stop"

        $release = Invoke-RestMethod -Headers @{ "User-Agent" = "azdo-agent" } `
          -Uri "https://api.github.com/repos/gitleaks/gitleaks/releases/latest"

        $asset = $release.assets | Where-Object { $_.name -match "windows_x64\.zip$" } | Select-Object -First 1
        if (-not $asset) { throw "Gitleaks not found" }

        $toolsDir = "$(Pipeline.Workspace)\tools\gitleaks"
        New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null

        $zipPath = Join-Path $toolsDir $asset.name
        Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
        Expand-Archive -Path $zipPath -DestinationPath $toolsDir -Force

        $gitleaksExe = Get-ChildItem -Path $toolsDir -Recurse -Filter "gitleaks.exe" | Select-Object -First 1
        & $gitleaksExe.FullName detect `
          --source "$(Build.SourcesDirectory)" `
          --no-git `
          --redact `
          --report-format json `
          --report-path "$(Build.ArtifactStagingDirectory)\gitleaks.json"
      displayName: "Run Gitleaks"

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)\gitleaks.json'
        artifactName: 'gitleaks-report'

 

# =====================================================
# STAGE 3 : BUILD (OPTIMIZED & LIGHT)
#Installation des dépendances production

#Build du frontend

#Création d’un dossier dist léger

#Build et push de l’image Docker vers Docker Hub



# =====================================================
- stage: build
  displayName: "BUILD (optimized)"
  dependsOn: security
  condition: succeeded()

  jobs:
  - job: docker_build
    displayName: "Build & Push Docker image"
    timeoutInMinutes: 90
    pool:
      name: $(AGENT_POOL)
      demands:
      - Agent.Name -equals $(AGENT_NAME)

    steps:
    - checkout: self
      clean: true

    - powershell: |
        $ErrorActionPreference = "Stop"
        $env:COMPOSER_CACHE_DIR = "$(COMPOSER_CACHE_DIR)"

        composer install `
          --no-dev `
          --prefer-dist `
          --no-interaction `
          --no-progress `
          --optimize-autoloader

        composer clear-cache
      displayName: "Composer install (prod)"

    - powershell: |
        $ErrorActionPreference = "Stop"

        npm ci --no-audit --no-fund
        npx mix --production
        Remove-Item -Recurse -Force node_modules
      displayName: "Frontend build"

    - powershell: |
        $ErrorActionPreference = "Stop"

        $dist = "$(Build.SourcesDirectory)\dist"
        if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
        New-Item -ItemType Directory -Force $dist | Out-Null

        robocopy "$(Build.SourcesDirectory)" "$dist" /E `
          /XD ".git" ".github" ".idea" ".vscode" "tests" "node_modules" "dist" "storage" `
          /XF ".env" | Out-Null

        New-Item -ItemType Directory -Force "$dist\storage\framework" | Out-Null
        New-Item -ItemType Directory -Force "$dist\storage\logs" | Out-Null

        @(
          ".git",".github",".idea",".vscode",
          "tests","node_modules",".env","*.log"
        ) | Out-File -Encoding utf8 "$dist\.dockerignore"

        Write-Host "DIST SIZE (MB):"
        (Get-ChildItem $dist -Recurse | Measure-Object Length -Sum).Sum / 1MB
      displayName: "Prepare light dist"

    - task: Docker@2
      inputs:
        command: login
        containerRegistry: '$(DOCKER_SC)'
      displayName: "Docker login"

    - task: Docker@2
      inputs:
        command: buildAndPush
        containerRegistry: '$(DOCKER_SC)'
        repository: '$(DOCKER_REPO)'
        Dockerfile: '$(Build.SourcesDirectory)\Dockerfile.dist'
        buildContext: '$(Build.SourcesDirectory)\dist'
        tags: |
          $(IMAGE_TAG)
          latest
      displayName: "Docker build & push"

# =========================
# STAGE 4 : DEPLOY (docker compose)
#Exécution seulement sur la branche main

#Création du fichier deploy.env

#Pull de la nouvelle image

#Redémarrage des conteneurs
# =========================
- stage: deploy
  displayName: "DEPLOY (docker compose)"
  dependsOn: build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: deploy_local
    displayName: "Deploy on agent machine"
    pool:
      name: $(AGENT_POOL)
      demands:
      - Agent.Name -equals $(AGENT_NAME)

    steps:
    - checkout: self
      clean: true

    - task: Docker@2
      inputs:
        command: login
        containerRegistry: '$(DOCKER_SC)'
      displayName: "Docker login (deploy)"

    - powershell: |
        $ErrorActionPreference = "Stop"

        $lines = @(
          "DOCKER_REPO=$(DOCKER_REPO)",
          "IMAGE_TAG=$(IMAGE_TAG)",
          "APP_PORT=$(DEPLOY_PORT)",
          "APP_KEY=$(APP_KEY)",
          "DB_HOST=db",
          "DB_DATABASE=akaunting",
          "DB_USERNAME=akaunting",
          "DB_PASSWORD=ChangeMeStrongPassword"
        )
        Set-Content -Path "$(DEPLOY_ENV_FILE)" -Value $lines -Encoding utf8

        docker compose version
        docker compose --env-file "$(DEPLOY_ENV_FILE)" down
        docker compose --env-file "$(DEPLOY_ENV_FILE)" pull
        docker compose --env-file "$(DEPLOY_ENV_FILE)" up -d --remove-orphans --force-recreate
        docker ps

        docker exec -i akaunting_app sh -lc "ls -la /var/www/html/vendor/autoload.php"
      displayName: "docker compose (recreate) + verify"

trigger:
- main

variables:
  # ---------- AGENT ----------
  AGENT_POOL: 'self-hosted'
  AGENT_NAME: 'ILYAS'

  # ---------- CACHES ----------
  COMPOSER_CACHE_DIR: '$(Pipeline.Workspace)\.composer'
  NPM_CACHE_DIR: '$(Pipeline.Workspace)\.npm'

  # ---------- DOCKER ----------
  DOCKER_SC: 'DockerHubSC'
  DOCKER_REPO: 'ilyase25/akaunting'
  IMAGE_TAG: '$(Build.BuildId)'

  # ---------- DEPLOY ----------
  DEPLOY_PORT: '8080'
  DEPLOY_ENV_FILE: '$(Pipeline.Workspace)\deploy.env'

stages:
# =========================
# STAGE 1 : TEST
#On récupère le code.

#On installe les dépendances.

#On crée le fichier .env.

#On utilise SQLite.

#On lance les tests Laravel.
# =========================
- stage: test
  displayName: "TEST"
  jobs:
  - job: phpunit
    displayName: "Laravel tests"
    pool:
      name: $(AGENT_POOL)
      demands:
      - Agent.Name -equals $(AGENT_NAME)
    steps:
    - checkout: self
      clean: true

    #  create cache dirs (fix tar chdir)
    - powershell: |
        New-Item -ItemType Directory -Force -Path "$(COMPOSER_CACHE_DIR)" | Out-Null
        New-Item -ItemType Directory -Force -Path "$(NPM_CACHE_DIR)" | Out-Null
      displayName: "Create cache folders"

    - task: Cache@2
      inputs:
        key: 'composer | "$(Agent.OS)" | composer.lock'
        restoreKeys: |
          composer | "$(Agent.OS)"
        path: $(COMPOSER_CACHE_DIR)
      displayName: "Cache Composer"

    - task: Cache@2
      inputs:
        key: 'npm | "$(Agent.OS)" | package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
        path: $(NPM_CACHE_DIR)
      displayName: "Cache NPM"

    - powershell: |
        $ErrorActionPreference = "Stop"

        $env:COMPOSER_CACHE_DIR = "$(COMPOSER_CACHE_DIR)"
        npm config set cache "$(NPM_CACHE_DIR)" --global

        if (!(Test-Path ".env")) {
          if (Test-Path ".env.example") { Copy-Item ".env.example" ".env" }
          elseif (Test-Path ".env.testing") { Copy-Item ".env.testing" ".env" }
          else {
            Set-Content -Path ".env" -Value @(
              "APP_ENV=testing",
              "APP_KEY=",
              "APP_DEBUG=true",
              "DB_CONNECTION=sqlite",
              "DB_DATABASE=database/database.sqlite",
              "CACHE_DRIVER=array",
              "SESSION_DRIVER=array",
              "QUEUE_CONNECTION=sync"
            ) -Encoding utf8
          }
        }

        New-Item -ItemType Directory -Force -Path "database" | Out-Null
        if (!(Test-Path "database/database.sqlite")) {
          New-Item -ItemType File -Force "database/database.sqlite" | Out-Null
        }

        composer install --no-interaction --prefer-dist --no-progress
        php artisan key:generate --force
        php artisan test
      displayName: "Install + Test"

# =========================
# STAGE 2 : SECURITY (Gitleaks report)  
#On analyse le code avec Gitleaks.

#On cherche des mots de passe et des secrets.

#On crée un rapport de sécurité.
# =========================
- stage: security
  displayName: "SECURITY (Gitleaks report)"
  dependsOn: test
  condition: succeeded()
  jobs:
  - job: security_scan
    displayName: "Secrets scan"
    pool:
      name: $(AGENT_POOL)
      demands:
      - Agent.Name -equals $(AGENT_NAME)
    steps:
    - checkout: self
      clean: true

    - powershell: |
        $ErrorActionPreference = "Stop"

        # 1) Get latest Gitleaks release from GitHub
        $release = Invoke-RestMethod -Headers @{ "User-Agent" = "azdo-agent" } `
          -Uri "https://api.github.com/repos/gitleaks/gitleaks/releases/latest"

        # 2) Pick Windows x64 zip
        $asset = $release.assets | Where-Object { $_.name -match "windows_x64\.zip$" } | Select-Object -First 1
        if (-not $asset) { throw "Gitleaks Windows x64 zip not found in latest release." }

        # 3) Download + extract inside Pipeline workspace
        $toolsDir = "$(Pipeline.Workspace)\tools\gitleaks"
        New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null

        $zipPath = Join-Path $toolsDir $asset.name
        Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath

        Expand-Archive -Path $zipPath -DestinationPath $toolsDir -Force

        # 4) Locate gitleaks.exe
        $gitleaksExe = Get-ChildItem -Path $toolsDir -Recurse -Filter "gitleaks.exe" | Select-Object -First 1
        if (-not $gitleaksExe) { throw "gitleaks.exe not found after extract." }

        # Verify tool works
        & $gitleaksExe.FullName version

        # 5) Create report
        $reportDir = "$(Build.ArtifactStagingDirectory)"
        New-Item -ItemType Directory -Force -Path $reportDir | Out-Null
        $report = Join-Path $reportDir "gitleaks.json"

        # 6) Scan
        & $gitleaksExe.FullName detect --source "$(Build.SourcesDirectory)" --no-git --redact `
          --report-format json --report-path "$report"

        Write-Host " Gitleaks report saved: $report"
      displayName: "Gitleaks scan (downloaded binary)"

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)\gitleaks.json'
        artifactName: 'security-gitleaks'
      displayName: "Publish Gitleaks report"

# =========================
# STAGE 3 : BUILD (Docker build + push)
#On se connecte à DockerHub.
#On crée une image Docker.
#On envoie l’image vers DockerHub.
# =========================
- stage: build
  displayName: "BUILD (Docker build & push)"
  dependsOn: security
  condition: succeeded()
  jobs:
  - job: docker_build
    displayName: "Build and push image"
    pool:
      name: $(AGENT_POOL)
      demands:
      - Agent.Name -equals $(AGENT_NAME)
    steps:
    - checkout: self
      clean: true

    - task: Docker@2
      inputs:
        command: login
        containerRegistry: '$(DOCKER_SC)'
      displayName: "Docker login"

    - task: Docker@2
      inputs:
        containerRegistry: '$(DOCKER_SC)'
        repository: '$(DOCKER_REPO)'
        command: 'buildAndPush'
        Dockerfile: '$(Build.SourcesDirectory)\Dockerfile'
        buildContext: '$(Build.SourcesDirectory)'
        tags: |
          $(IMAGE_TAG)
          latest
      displayName: "Docker build & push"

# =========================
# STAGE 4 : DEPLOY (docker compose)
#On utilise Docker Compose.
#On lance l’application automatiquement.
#L’application fonctionne sur le port 8080.
# =========================
- stage: deploy
  displayName: "DEPLOY (docker compose)"
  dependsOn: build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: deploy_local
    displayName: "Deploy on agent machine"
    pool:
      name: $(AGENT_POOL)
      demands:
      - Agent.Name -equals $(AGENT_NAME)
    steps:
    - checkout: self
      clean: true

    - task: Docker@2
      inputs:
        command: login
        containerRegistry: '$(DOCKER_SC)'
      displayName: "Docker login (deploy)"

    - powershell: |
        $ErrorActionPreference = "Stop"

        $lines = @(
          "DOCKER_REPO=$(DOCKER_REPO)",
          "IMAGE_TAG=$(IMAGE_TAG)",
          "APP_PORT=$(DEPLOY_PORT)",
          "DB_HOST=db",
          "DB_DATABASE=akaunting",
          "DB_USERNAME=akaunting",
          "DB_PASSWORD=ChangeMeStrongPassword"
        )
        Set-Content -Path "$(DEPLOY_ENV_FILE)" -Value $lines -Encoding utf8

        docker compose version
        docker compose --env-file "$(DEPLOY_ENV_FILE)" pull
        docker compose --env-file "$(DEPLOY_ENV_FILE)" up -d --remove-orphans
        docker ps
      displayName: "docker compose pull + up"
